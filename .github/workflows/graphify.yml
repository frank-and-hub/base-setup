name: Codebase Knowledge Graph CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  graphify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify & Tree-Sitter Parsers
        run: |
          python -m pip install --upgrade pip
          pip install "graphifyy[sql]"

      - name: Verify Knowledge Graph Integrity
        run: |
          graphify update .
          graphify query "AuthService"
          graphify path "AuthService" "PrismaService"

      - name: Export Visualization Artifacts
        run: |
          graphify export html
          graphify export callflow-html
          graphify tree .

      - name: Upload Knowledge Graph Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-graph-artifacts
          path: |
            graphify-out/graph.html
            graphify-out/GRAPH_TREE.html
            graphify-out/*.html
            graphify-out/GRAPH_REPORT.md
          retention-days: 14

